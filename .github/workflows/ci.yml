name: CI

# Gitflow: feature/* -> develop -> release/x.y.z -> main (+ tag vX.Y.Z); hotfix/* parte da main.
on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: [develop, "release/**", "hotfix/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tipos e lint (catraca)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # O projeto tem erros antigos: o CI só barra o que PIOROU em relação a .ci/baseline.json.
      - name: Catraca de qualidade (tsc + eslint)
        run: node scripts/ci/ratchet.js

      # Testes de lógica pura (node:test, sem emulador): rota da notificação, status dos agendamentos etc.
      - name: Testes
        run: npm test

  config:
    name: Configuração do Expo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Por enquanto só informa; não bloqueia o merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: expo-doctor
        run: npx --yes expo-doctor@latest
